    <style>
      :root {
        --bg: #0b0b0b;
        --card: #121212;
        --ink: #eee;
        --muted: #b7b7b7;
        --accent: #d81d49;
        --accent-2: #ff4d6d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(
            1200px 600px at 80% -10%,
            rgba(216, 29, 73, 0.15),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 10% 110%,
            rgba(255, 77, 109, 0.12),
            transparent 60%
          ),
          var(--bg);
        color: var(--ink);
        font-family: "Kanit", system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .wrap {
        width: min(900px, 96vw);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 30px rgba(216, 29, 73, 0.35);
      }
      .logo span {
        font-weight: 800;
        font-size: 20px;
        color: #fff;
      }
      .title {
        line-height: 1;
      }
      .title h1 {
        margin: 0;
        font-size: clamp(22px, 3vw, 28px);
      }
      .title p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .card {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0)
        );
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      blockquote {
        margin: 0;
        font-size: clamp(22px, 4vw, 36px);
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      blockquote .cursor {
        display: inline-block;
        width: 10px;
        background: var(--ink);
        animation: blink 0.9s steps(1) infinite;
        vertical-align: baseline;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      button,
      .ghost {
        appearance: none;
        border: none;
        cursor: pointer;
        border-radius: 14px;
        padding: 12px 16px;
        font-weight: 600;
        color: #fff;
        transition: transform 0.08s ease, box-shadow 0.2s ease,
          background 0.2s ease;
        outline: none;
      }
      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 30px rgba(216, 29, 73, 0.35);
      }
      .primary:hover {
        transform: translateY(-1px);
      }
      .ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--ink);
      }
      .ghost:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .tiny {
        font-size: 12px;
        color: var(--muted);
      }

      details {
        margin-top: 18px;
      }
      summary {
        cursor: pointer;
        list-style: none;
        color: var(--muted);
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .adder {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 10px;
      }
      textarea {
        width: 100%;
        min-height: 70px;
        border-radius: 12px;
        background: #0e0e0e;
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px;
        font-family: inherit;
      }
      .list {
        margin-top: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tag {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--muted);
      }

      footer {
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .kbd {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-bottom-width: 2px;
        border-radius: 8px;
        padding: 2px 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%) translateY(150%);
        background: #161616;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 10px 14px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transition: transform 0.25s ease;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      .back-btn {
        position: fixed;
        top: 18px;
        left: 18px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #d81d49, #ff4d6d);
        box-shadow: 0 6px 20px rgba(216, 29, 73, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .back-btn:hover {
        transform: scale(1.1) translateY(-2px);
        box-shadow: 0 8px 28px rgba(255, 77, 109, 0.7);
      }

      .back-btn a {
        color: white;
        font-size: 20px;
        text-decoration: none;
        line-height: 1;
        font-weight: bold;
      }

  </head>

    <div class="back-btn">

  </div>

        </details>

        <footer>
          <span class="tiny"
            >กด <span class="kbd">Space</span> เพื่อสุ่มได้เหมือนกัน</span

          <span class="tiny">© ทำด้วยความกวนใจที่พอดี ๆ</span>
        </footer>
      </main>
    </div>

        "ความสุขคือการได้กด Add to Cart แล้วไม่คิดมาก",
        "ชีวิตเหมือน Playlist มีทั้งเพลงเศร้า เพลงสนุก",
        "อยากมีชีวิตเรียบง่าย แต่ Wi-Fi ต้องแรง",
        "ปัญหาคือ Tutorial ของชีวิต",
        "ความสุขง่าย ๆ คือการได้หัวเราะกับเรื่องโง่ ๆ",
        "ชีวิตไม่ใช่เกม แต่ก็มีให้กด Restart บ่อย ๆ",
      ];

      // ====== การจัดการคำคมที่ผู้ใช้เพิ่ม ======
      const LS_KEY = "meme-quotes-custom";
      const loadCustomQuotes = () => {
        try {
          return JSON.parse(localStorage.getItem(LS_KEY) || "[]");
        } catch {
          return [];
        }
      };
      const saveCustomQuotes = (arr) =>
        localStorage.setItem(LS_KEY, JSON.stringify(arr));

      // ====== DOM ======
      const quoteEl = document.getElementById("quote");
      const btnRandom = document.getElementById("btn-random");
      const btnCopy = document.getElementById("btn-copy");
      const btnShare = document.getElementById("btn-share");
      const customInput = document.getElementById("custom-input");
      const btnAdd = document.getElementById("btn-add");
      const customList = document.getElementById("custom-list");
      const toast = document.getElementById("toast");

      let current = "";

      function getAllQuotes() {
        return [...defaultQuotes, ...loadCustomQuotes()];
      }

      function randomQuote() {
        const all = getAllQuotes();
        if (!all.length) return "ยังไม่มีคำคมเลย ลองเพิ่มสักอันสิ";
        let pick;
        do {
          pick = all[Math.floor(Math.random() * all.length)];
        } while (pick === current && all.length > 1);
        current = pick;
        typeTo(quoteEl, pick);
        return pick;
      }

      // ====== เอฟเฟกต์พิมพ์ทีละตัว ======
      let typerId;
      function typeTo(el, text) {
        clearInterval(typerId);
        el.innerHTML = "";
        const span = document.createElement("span");
        el.appendChild(span);
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        cursor.innerHTML = "&nbsp;";
        el.appendChild(cursor);
        let i = 0;
        typerId = setInterval(() => {
          span.textContent = text.slice(0, ++i);
          if (i >= text.length) {
            clearInterval(typerId);
          }
        }, 18);
      }

      // ====== ปุ่ม ======
      btnRandom.addEventListener("click", randomQuote);

      btnCopy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(
            current || quoteEl.textContent.trim()
          );
          showToast("คัดลอกแล้ว!");
        } catch (e) {
          showToast("คัดลอกไม่สำเร็จ");
        }
      });

      btnShare.addEventListener("click", async () => {
        const text = current || quoteEl.textContent.trim();
        if (navigator.share) {
          try {
            await navigator.share({ title: "สุ่มคำคมกวนตีน", text });
          } catch {
            /* user canceled */
          }
        } else {
          await navigator.clipboard.writeText(text);
          showToast("คัดลอกข้อความไว้สำหรับแชร์แล้ว");
        }
      });

      // เพิ่มคำคมของผู้ใช้
      function renderCustomList() {
        const arr = loadCustomQuotes();
        customList.innerHTML = "";
        arr.forEach((q, idx) => {
          const el = document.createElement("span");
          el.className = "tag";
          el.textContent =
            '"' + q.slice(0, 40) + (q.length > 40 ? "…" : "") + '"';
          el.title = q;
          el.addEventListener("click", () => {
            current = q;
            typeTo(quoteEl, q);
          });
          // ลบด้วยคลิกขวา
          el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            const c = loadCustomQuotes();
            c.splice(idx, 1);
            saveCustomQuotes(c);
            renderCustomList();
          });
          customList.appendChild(el);
        });
      }

      btnAdd.addEventListener("click", () => {
        const val = (customInput.value || "").trim();
        if (!val) return;
        const arr = loadCustomQuotes();
        arr.unshift(val);
        saveCustomQuotes(arr);
        customInput.value = "";
        renderCustomList();
        showToast("เพิ่มคำคมแล้ว");
      });

      // กด Space เพื่อสุ่ม
      window.addEventListener("keydown", (e) => {
        if (
          e.code === "Space" &&
          !/INPUT|TEXTAREA/.test(document.activeElement.tagName)
        ) {
          e.preventDefault();
          randomQuote();
        }
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(showToast.tid);
        showToast.tid = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      // เริ่มต้นสุ่มหนึ่งครั้งเพื่อโชว์ความสามารถ
      randomQuote();
      renderCustomList();
    </script>
  </body>
</html>
