<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quotes</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
    }

    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }

    a {
      display: inline-block;
      padding: 15px 40px;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
      border: 2px solid #00c3ff;
      border-radius: 50px;
      background: linear-gradient(45deg, #00c3ff, #7700ff);
      transition: 0.4s ease;
      box-shadow: 0 5px 20px rgba(0, 195, 255, 0.4);
    }

    a:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 8px 30px rgba(0, 195, 255, 0.8);
      text-shadow: 0 0 8px #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Welcome ✨</h1>
    <a href="{% url 'random_quotes' %}">Get Random Quotes</a>
  </div>
</body>
</html>
